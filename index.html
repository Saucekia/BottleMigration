<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Bottle Through Battersea</title>
  <h1 class = "hdr" >A Bottle Through Battersea</h1>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; overflow-x: hidden; background-color: rgb(236, 233, 225); }

    /* bottle position and format stuff */
    .bottle {
      position: fixed;
      top: 50%;
      left: 30%;
      transform: translate(-50%, -50%);
      width: 40vw;
      height: 90vh;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }

    .hdr{
    min-height: 100vh;
      margin-left: 57%;
      padding: 20vh 6vw 10vh 0;
      font-size: 80px;

    }
    
    .trash-scene {
      position: relative;
      height: 100vh;
      z-index: 3; /* in front of the bottle */
      pointer-events: none;

      /* adjust blend */
      mix-blend-mode: multiply;
    opacity: 0.85;
    }
    .trash { position: absolute; height: auto; }

    /* initial trash pos */
    .trash-1 { width: 40vw; top: -30%; left: -7%; transform: rotate(-14deg); }
    .trash-2 { width: 50vw; top:  4%; right: 0%; transform: rotate(13deg); }
    .trash-3 { width: 34vw; top: 34%; left:  10%; transform: rotate(19deg); }
    .trash-4 { width: 50vw; top: 36%; right: -9%; transform: rotate(-9deg); }
    .trash-5 { width: 27vw; top: 80%; left: 5%; transform: rotate(-20deg); }
    .trash-6 { width: 28vw; top: 65%; right: 8%; transform: rotate(10deg); }

    /* content stuff */
    .content { position: relative; z-index: 1; }
    .section {
      min-height: 100vh;
      margin-left: 57%;
      padding: 20vh 6vw 10vh 0;
    }
    .section h2 { margin-top: 0; }
    .section p { line-height: 1.6; }

    /* Only the basic adjustment needed for narrow screens. */
    @media (max-width: 700px) {
      .bottle { left: 50%; top: 28%; width: 55vw; height: 45vh; }
      .trash { width: 48vw; }
      .section { margin-left: 0; padding: 60vh 8vw 10vh; }
    }
  </style>
</head>
<body>
  <!-- fixed -->
  <img class="bottle" src="BottleImages/bottle_3.png" alt="Bottle">

  <!-- Initial Trash -->
  <div class="trash-scene" aria-hidden="true">
    <img class="trash trash-1" src="assets/trash_1.png" alt="">
    <img class="trash trash-2" src="assets/trash_2.png" alt="">
    <img class="trash trash-3" src="assets/trash_3.png" alt="">
    <img class="trash trash-4" src="assets/trash_4.png" alt="">
    <img class="trash trash-5" src="assets/trash_5.png" alt="">
    <img class="trash trash-6" src="assets/trash_6.png" alt="">
  </div>

  <!-- Template -->
  <main class="content">
    <section class="section">
      <h2>Section 01</h2>
      <p>SECTION</p>
    </section>
    <section class="section">
      <h2>Section 02</h2>
      <p>SECTION</p>
    </section>
    <section class="section">
      <h2>Section 03</h2>
      <p>SECTION</p>
    </section>
  </main>
</body>
</html>
